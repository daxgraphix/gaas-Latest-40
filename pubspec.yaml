name: gaas
description: "GAAS - Gamified Adaptive Arithmetic System. Offline-first math learning app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Local Database
  shared_preferences: ^2.3.4

  # Game Engine
  flame: ^1.21.0

  # UI/UX Animations
  flutter_animate: ^4.5.2

  # Charts
  fl_chart: ^0.70.0

  # PDF Export & Sharing
  pdf: ^3.10.8
  share_plus: ^10.0.2
  printing: ^5.12.0

  # Utilities
  path_provider: ^2.1.5
  uuid: ^4.5.1

  # Audio
  # audioplayers: ^6.1.0 # Temporarily disabled for Windows build testing

  # Notifications
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4

  # Icons
  cupertino_icons: ^1.0.8

  intl: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Removed isar_generator dependency

flutter:
  uses-material-design: true
  generate: true
  
  assets:
    - assets/l10n/
    - assets/sounds/
    - assets/icon/
    - assets/levels/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#6366F1"
  adaptive_icon_foreground: "assets/icon/app_icon.png"